<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সহজ সমাধান — Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<header><div><b>সহজ সমাধান</b><small>Admin Panel</small></div><button onclick="logout()">লগআউট</button></header>
<main id="login"><div class="box"><h1>Admin Login</h1><p>শুধু দোকান পরিচালনার জন্য।</p><input id="pin" type="password" placeholder="Admin PIN"><button onclick="login()">Login</button><p id="err"></p></div></main>
<main id="panel" hidden><section class="stats"><div><span>Products</span><b id="pc">0</b></div><div><span>Orders</span><b>WhatsApp</b></div><div><span>Sales</span><b>Private</b></div></section>
<section class="box"><h2>নতুন Product যোগ করুন</h2><form id="form"><label>Product Image<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Product Name<input id="name" required></label><label>Category<input id="category" required></label><label>Regular Price<input id="regular" type="number" min="0" required></label><label>Discount Price<input id="discount" type="number" min="0"></label><label>Stock<input id="stock" type="number" min="0" required></label><label>Description<textarea id="desc"></textarea></label><button type="submit">Publish Product</button></form></section>
<section><h2>Products</h2><div id="list"></div></section></main><script src="admin.js"></script></body></html>
